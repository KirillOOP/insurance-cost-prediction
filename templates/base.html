<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Прогнозування вартості медичного страхування{% endblock %}</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1b2b40;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}
header{background:#142c4e;color:white;padding:22px max(24px,calc((100vw - 1100px)/2))}header h1{margin:0 0 10px;font-size:24px}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:#dceafe;text-decoration:none;font-weight:600}nav a:hover{text-decoration:underline}
main{max-width:1100px;margin:28px auto;padding:0 20px 50px}.panel{background:white;border:1px solid #e4e9f1;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 3px 16px #1d3b6010}h2{margin:0 0 16px}h3{margin-top:0}p{line-height:1.6}.muted{color:#637085}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stat{background:#edf4ff;border-radius:10px;padding:18px}.stat strong{display:block;font-size:24px;color:#153f77}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e3e9f1}th{background:#edf3fa}table tr:hover{background:#f9fbff}.scroll{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}label{display:block;font-weight:650;margin:0 0 6px}input,select{width:100%;padding:11px;border:1px solid #bfcbda;border-radius:8px;background:white;font-size:15px}.field{margin-bottom:17px}button{background:#1458a8;color:white;border:0;border-radius:8px;padding:12px 22px;font-weight:bold;cursor:pointer}button:hover{background:#0d417f}.error{background:#fff0ed;border-left:4px solid #b33930;padding:12px}.success{background:#e7f5ec;border-left:4px solid #25844d;padding:18px;font-size:17px}.success strong{font-size:30px}.plot{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #e4e9f1}.plot-card{margin:15px 0 30px}.small{font-size:13px}
</style></head><body><header><h1>Прогнозування вартості медичного страхування</h1><nav><a href="{{ url_for('index') }}">Головна</a><a href="{{ url_for('analytics') }}">Аналітика моделей</a><a href="{{ url_for('predict') }}">Прогнозування</a></nav></header><main>{% block content %}{% endblock %}</main></body></html>
